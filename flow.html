<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设变流程工序</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0d1b2a; --panel:#152433; --panel2:#1b2f42;
    --border:rgba(86,175,224,.18); --text:#e8f1f8; --sub:#7fa3c0;
    --accent:#56afe0; --green:#3ddc84; --yellow:#ffc83d;
    --orange:#ff8c42; --red:#ff4d6d; --purple:#a78bfa;
  }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); color:var(--text);
    padding:10px 16px 12px;
    display:flex; flex-direction:column;
  }
  .header{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:20px;
    padding:0 4px 10px;
    border-bottom:1px solid var(--border);
    margin-bottom:10px;
    flex-shrink:0;
    position:relative;
  }
  .header .logo-wrap{ display:flex; align-items:center; }
  .header .logo-wrap img{ height:46px; width:auto; display:block; }
  .header .logo-wrap img+img{ margin-left:10px; }
  .header .title-center{ position:absolute; left:50%; transform:translateX(-50%); text-align:center; }
  .header h1{
    font-size:20px; font-weight:700; letter-spacing:2px;
    background:linear-gradient(90deg,#56afe0,#3ddc84);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .header .sub{ font-size:12px; color:var(--sub); margin-top:2px; }
  .header .date{ font-size:12px; color:var(--sub); text-align:right; }
  .header .date .now{ font-size:16px; color:var(--accent); font-weight:600; }
  .back-btn{
    display:inline-block; padding:4px 12px; font-size:12px;
    color:var(--accent); border:1px solid var(--accent); border-radius:6px;
    text-decoration:none; cursor:pointer; background:transparent;
  }
  .back-btn:hover{ background:rgba(86,175,224,.1); }

  .flow-table-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:8px 12px; display:flex; flex-direction:column;
    flex:1; min-height:0;
  }
  .flow-scroll{
    flex:1; overflow:auto;
    scrollbar-width:thin; scrollbar-color:rgba(86,175,224,.3) transparent;
  }
  .flow-scroll::-webkit-scrollbar{ width:6px; height:6px; }
  .flow-scroll::-webkit-scrollbar-thumb{ background:rgba(86,175,224,.3); border-radius:3px; }
  .flow-scroll::-webkit-scrollbar-track{ background:transparent; }
  .flow-table{ border-collapse:collapse; font-size:12px; width:100%; table-layout:fixed; }
  .flow-table th, .flow-table td{
    border:1px solid rgba(86,175,224,.12);
    padding:4px 2px; text-align:center; white-space:nowrap;
  }
  .flow-table thead th{
    color:var(--sub); font-weight:600; background:rgba(27,47,66,.6);
    position:sticky; top:0; z-index:5;
  }
  .flow-table thead th.n-col{ color:#ffc83d; background:rgba(255,200,61,.08); }
  .flow-table .stage-main{
    background:rgba(27,47,66,.4); color:var(--accent); font-weight:600;
    font-size:12px; text-align:center; vertical-align:middle;
    white-space:nowrap;
  }
  .flow-table .stage-sub{ color:var(--sub); font-size:11px; background:rgba(27,47,66,.2); text-align:center; vertical-align:middle; }
  .flow-table .stage-single{
    background:rgba(27,47,66,.4); color:var(--accent); font-weight:600; font-size:12px;
    text-align:center; vertical-align:middle; white-space:nowrap;
  }
  .flow-table tbody tr{ height:40px; }
  .flow-table td.num-cell{ color:var(--text); font-weight:600; }
  .flow-table td.num-zero{ color:rgba(127,163,192,.2); }
  .flow-table td.n-col-cell{ background:rgba(255,200,61,.06); }
  .flow-table tbody tr:hover td{ background:rgba(86,175,224,.06); }
  .flow-table tbody tr.row-warn td{ color:var(--red); }
  .flow-table tbody tr.row-warn td.num-zero{ color:rgba(255,77,109,.2); }

  .flow-slider{
    flex-shrink:0; height:40px; position:relative;
    padding:12px 8px 4px; margin-top:4px;
  }
  .slider-track{
    position:absolute; left:8px; right:8px; top:16px;
    height:6px; background:rgba(127,163,192,.15); border-radius:3px;
  }
  .slider-range{
    position:absolute; top:16px; height:6px;
    background:var(--accent); border-radius:3px; opacity:.5;
  }
  .slider-handle{
    position:absolute; top:10px; width:10px; height:18px;
    background:var(--accent); border-radius:4px;
    cursor:ew-resize; z-index:2;
    box-shadow:0 0 4px rgba(86,175,224,.4);
  }
  .slider-handle:hover{ background:#7fc4f0; }
  .slider-labels{
    position:absolute; left:8px; right:8px; bottom:0;
    display:flex; justify-content:space-between;
    font-size:10px; color:var(--sub);
  }
</style>
</head>

var flowDates=(function(){
  var today=new Date();
  var dates=[];
  for(var i=-15;i<=15;i++){
    var d=new Date(today);
    d.setDate(d.getDate()+i);
    dates.push((d.getMonth()+1)+'/'+d.getDate());
  }
  return dates;
})();
var nIdx=15;
var flowViewStart=8;
var flowViewEnd=22;
var flowMinSpan=7;

function padFlowData(arr){
  var result=new Array(31).fill(0);
  var offset=8;
  for(var i=0;i<arr.length&&(offset+i)<31;i++){
    result[offset+i]=arr[i];
  }
  return result;
}
function padStages(stages){
  return stages.map(function(s){
    if(s.type==='single'){
      return {label:s.label,type:s.type,data:padFlowData(s.data)};
    }
    return {label:s.label,type:s.type,children:s.children.map(function(c){
      return {label:c.label,data:padFlowData(c.data)};
    })};
  });
}
function cellClass(val,isN){
  var cls='num-cell';
  if(isN) cls+=' n-col-cell';
  if(val===0) cls+=' num-zero';
  return cls;
}
function numCells(data){
  var slice=data.slice(flowViewStart,flowViewEnd+1);
  var viewN=nIdx-flowViewStart;
  return slice.map(function(v,idx){
    var isN=idx===viewN;
    return '<td class="'+cellClass(v,isN)+'">'+(v||'')+'</td>';
  }).join('');
}
function renderFlow(deptKey){
  var stages=padStages(deptKey?flowStagesByDept[deptKey]:flowStagesAll);
  var viewDates=flowDates.slice(flowViewStart,flowViewEnd+1);
  var viewN=nIdx-flowViewStart;
  var html='';
  html+='<thead><tr>';
  html+='<th colspan="2" style="width:90px">流程阶段</th>';
  for(var i=0;i<viewDates.length;i++){
    var cls=i===viewN?' class="n-col"':'';
    html+='<th'+cls+'>'+viewDates[i]+'</th>';
  }
  html+='</tr></thead><tbody>';
  stages.forEach(function(s){
    if(s.type==='single'){
      html+='<tr>';
      html+='<td class="stage-single" colspan="2">'+s.label+'</td>';
      html+=numCells(s.data);
      html+='</tr>';
    } else {
      s.children.forEach(function(c,ci){
        var rowCls=c.label.indexOf('未')>-1?' class="row-warn"':'';
        html+='<tr'+rowCls+'>';
        if(ci===0){
          html+='<td class="stage-main" rowspan="'+s.children.length+'">'+s.label+'</td>';
        }
        html+='<td class="stage-sub">'+c.label+'</td>';
        html+=numCells(c.data);
        html+='</tr>';
      });
    }
  });
  html+='</tbody>';
  document.getElementById('flowTable').innerHTML=html;
}

renderFlow(null);

function updateSlider(){
  var slider=document.getElementById('flowSlider');
  var track=slider.querySelector('.slider-track');
  var range=document.getElementById('sliderRange');
  var left=document.getElementById('sliderLeft');
  var right=document.getElementById('sliderRight');
  var labels=document.getElementById('sliderLabels');
  var total=31;
  var leftPct=flowViewStart/total*100;
  var rightPct=(flowViewEnd+1)/total*100;
  range.style.left=leftPct+'%';
  range.style.width=(rightPct-leftPct)+'%';
  left.style.left='calc('+(leftPct)+'% - 5px)';
  right.style.left='calc('+(rightPct)+'% - 5px)';
  labels.innerHTML='<span>'+flowDates[0]+'</span><span>N</span><span>'+flowDates[30]+'</span>';
}

(function(){
  var slider=document.getElementById('flowSlider');
  var track=slider.querySelector('.slider-track');
  var leftH=document.getElementById('sliderLeft');
  var rightH=document.getElementById('sliderRight');
  var total=31;
  var dragging=null;
  var onMove,onUp;

  function idxFromX(clientX){
    var rect=track.getBoundingClientRect();
    var pct=(clientX-rect.left)/rect.width;
    if(pct<0) pct=0;
    if(pct>1) pct=1;
    return Math.round(pct*(total-1));
  }

  function startDrag(which,e){
    e.preventDefault();
    dragging=which;
    document.body.style.cursor='ew-resize';
    document.body.style.userSelect='none';
    onMove=function(ev){
      if(!dragging) return;
      var idx=idxFromX(ev.clientX);
      if(dragging==='left'){
        if(idx>=flowViewEnd-flowMinSpan) idx=flowViewEnd-flowMinSpan;
        if(idx<0) idx=0;
        if(idx!==flowViewStart){
          flowViewStart=idx;
          renderFlow(currentDept);
          updateSlider();
        }
      } else {
        if(idx<=flowViewStart+flowMinSpan) idx=flowViewStart+flowMinSpan;
        if(idx>total-1) idx=total-1;
        if(idx!==flowViewEnd){
          flowViewEnd=idx;
          renderFlow(currentDept);
          updateSlider();
        }
      }
    };
    onUp=function(){
      dragging=null;
      document.body.style.cursor='';
      document.body.style.userSelect='';
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  }

  leftH.addEventListener('mousedown',function(e){ startDrag('left',e); });
  rightH.addEventListener('mousedown',function(e){ startDrag('right',e); });
})();

updateSlider();
