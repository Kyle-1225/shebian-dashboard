<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设变数据看板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0d1b2a; --panel:#152433; --panel2:#1b2f42;
    --border:rgba(86,175,224,.18); --text:#e8f1f8; --sub:#7fa3c0;
    --accent:#56afe0; --green:#3ddc84; --yellow:#ffc83d;
    --orange:#ff8c42; --red:#ff4d6d; --purple:#a78bfa;
  }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); color:var(--text);
    padding:10px 16px 12px;
    display:flex; flex-direction:column;
  }
  .header{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:20px;
    padding:0 4px 10px;
    border-bottom:1px solid var(--border);
    margin-bottom:10px;
    flex-shrink:0;
    position:relative;
  }
  .header .logo-wrap{ display:flex; align-items:center; }
  .header .logo-wrap img{ height:46px; width:auto; display:block; }
  .header .logo-wrap img+img{ margin-left:10px; }
  .header .title-center{ position:absolute; left:50%; transform:translateX(-50%); text-align:center; }
  .header h1{
    font-size:20px; font-weight:700; letter-spacing:2px;
    background:linear-gradient(90deg,#56afe0,#3ddc84);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .header .sub{ font-size:12px; color:var(--sub); margin-top:2px; }
  .header .date{ font-size:12px; color:var(--sub); text-align:right; }
  .header .date .now{ font-size:16px; color:var(--accent); font-weight:600; }
  .back-btn{
    display:inline-block; padding:4px 12px; font-size:12px;
    color:var(--accent); border:1px solid var(--accent); border-radius:6px;
    text-decoration:none; cursor:pointer; background:transparent;
  }
  .back-btn:hover{ background:rgba(86,175,224,.1); }

  .kpi-row{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px;
    flex-shrink:0;
  }
  .kpi-card{
    background:linear-gradient(135deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--border); border-radius:10px; padding:8px 14px;
    position:relative; overflow:hidden;
  }
  .kpi-card::before{
    content:''; position:absolute; left:0; top:0; width:4px; height:100%;
    background:var(--accent);
  }
  .kpi-card.g::before{ background:var(--green); }
  .kpi-card.r::before{ background:var(--red); }
  .kpi-card.y::before{ background:var(--yellow); }
  .kpi-card.p::before{ background:var(--purple); }
  .kpi-card .label{ font-size:12px; color:var(--sub); margin-bottom:4px; }
  .kpi-card .value{ font-size:26px; font-weight:700; line-height:1; }
  .kpi-card .unit{ font-size:13px; color:var(--sub); margin-left:3px; }
  .kpi-card .delta{ font-size:11px; margin-top:4px; }
  .kpi-card .delta.up{ color:var(--green); }
  .kpi-card .delta.down{ color:var(--red); }

  .table-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 12px;
    display:flex; flex-direction:column; flex:1; min-height:0;
  }
  .table-card .title{
    font-size:14px; font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:8px;
    flex-shrink:0;
  }
  .table-card .title::before{ content:''; width:3px; height:14px; border-radius:2px; background:var(--accent); }
  .table-scroll{ flex:1; overflow:auto; scrollbar-width:thin; scrollbar-color:rgba(86,175,224,.3) transparent; }
  .table-scroll::-webkit-scrollbar{ width:6px; height:6px; }
  .table-scroll::-webkit-scrollbar-thumb{ background:rgba(86,175,224,.3); border-radius:3px; }
  .table-scroll::-webkit-scrollbar-track{ background:transparent; }
  .data-table{ width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
  .data-table th{
    text-align:center; padding:6px 8px; color:var(--sub); font-weight:600;
    border-bottom:1px solid var(--border); white-space:nowrap;
    position:sticky; top:0; background:var(--panel); z-index:5;
  }
  .data-table td{ text-align:center; padding:12px 8px; border-bottom:1px solid rgba(86,175,224,.08); }
  .data-table tr:hover td{ background:rgba(86,175,224,.06); }
  .data-table td.col-time{ white-space:nowrap; color:var(--sub); font-size:11px; }
  .data-table td.cell-wrap{ text-align:left; white-space:normal; line-height:1.5; }

  .tag{ display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .tag-red{ background:rgba(255,77,109,.15); color:#ff4d6d; }
  .tag-orange{ background:rgba(255,140,66,.15); color:#ff8c42; }
  .tag-yellow{ background:rgba(255,200,61,.15); color:#ffc83d; }
  .tag-green{ background:rgba(61,220,132,.15); color:#3ddc84; }
  .tag-blue{ background:rgba(86,175,224,.15); color:#56afe0; }
  .tag-purple{ background:rgba(167,139,250,.15); color:#a78bfa; }
  .tag-gray{ background:rgba(127,163,192,.15); color:#7fa3c0; }

  .resize-handle{ position:absolute; right:0; top:0; width:4px; height:100%; cursor:col-resize; user-select:none; }
  .resize-handle:hover{ background:var(--accent); }
</style>
</head>

</div>

<script>
function tick(){
  var d=new Date();
  var p=function(n){return String(n).padStart(2,'0');};
  document.getElementById('now').textContent=
    d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
tick(); setInterval(tick,1000);

var detailRows=[
  ['2026-01-15','A级','电装','VCJ-26-2058','是','CA769','320','NAA34','0','华域视觉','2026-01-20','2026-01-25','1.首件到货标签为旧简号，需隔离更换。2.全车型A级切换，其他车型继续使用。','传祺生产物流一科'],
  ['2026-02-03','B级','内装','VCJ-26-1934','否','CFM01','150','CFM86','0','嘉利','2026-02-10','2026-02-15','','传祺生产物流一科'],
  ['2026-02-18','C级','外装','DZB-26-4698','是','EGW52','80','EGW53','0','华达','2026-02-25','2026-03-01','1.首件到货标签为旧简号，需隔离更换。','传祺生产物流一科'],
  ['2026-03-05','E级','仪表','VCJ-26-2101','是','NAA34','45','NAA35','0','重庆光大','2026-03-12','2026-03-15','','传祺生产物流二科'],
  ['2026-03-20','F级','车门','DZB-26-4712','否','CA769','200','CA770','0','佐尔','2026-03-28','2026-04-01','1.F级切换，仅限指定车型使用。2.首件到货标签为旧简号，需隔离更换。','传祺生产物流二科'],
  ['2026-04-08','N级','电装','VCJ-26-2150','是','CFM86','60','CFM87','0','华域视觉','2026-04-15','2026-04-20','','传祺生产物流二科'],
  ['2026-04-22','A级','外装','VCJ-26-2188','是','EGW52','90','EGW54','0','华达','2026-04-30','2026-05-05','1.首件到货标签为旧简号，需隔离更换。2.A级切换，全车型生效。','埃安生产物流一科'],
  ['2026-05-10','B级','车门','DZB-26-4801','否','NAA34','120','NAA36','0','嘉利','2026-05-18','2026-05-22','','埃安生产物流一科'],
  ['2026-05-25','C级','仪表','VCJ-26-2233','是','CA769','75','CA771','0','重庆光大','2026-06-01','2026-06-05','1.C级切换，仅限仪表车型使用。','埃安生产物流一科'],
  ['2026-06-12','E级','内装','VCJ-26-2270','否','CFM01','40','CFM88','0','佐尔','2026-06-20','2026-06-25','','埃安生产物流二科'],
  ['2026-07-03','A级','电装','DZB-26-4920','是','EGW52','110','EGW55','0','华域视觉','2026-07-10','2026-07-15','1.首件到货标签为旧简号，需隔离更换。2.A级切换，全车型生效。','埃安生产物流二科'],
  ['2026-07-20','F级','车门','VCJ-26-2315','否','NAA34','95','NAA37','0','华达','2026-07-28','2026-08-01','','埃安生产物流二科']
];

var levelTag={
  'A级':'tag-red',
  'B级':'tag-orange',
  'C级':'tag-yellow',
  'D级':'tag-green',
  'E级':'tag-blue',
  'F级':'tag-purple',
  'N级':'tag-gray'
};

// Get selected regions from URL
function getSelectedRegions(){
  var params = new URLSearchParams(window.location.search);
  var regionsParam = params.get('regions');
  if(!regionsParam) return null; // null means all regions
  var arr = regionsParam.split(',').filter(function(r){return r;});
  if(arr.length === 0) return null;
  return arr;
}

var selectedRegions = getSelectedRegions();

// Determine status of each detail row
function getRowStatus(row){
  var dateStr = row[0]; // 切换时间
  var level = row[1];
  var rowDate = new Date(dateStr);
  var today = new Date();
  today.setHours(0,0,0,0);
  var diffDays = Math.floor((today - rowDate) / (1000*60*60*24));
  
  if(diffDays > 60) return 'completed';
  if(diffDays > 30 && (level === 'A级' || level === 'B级')) return 'overdue';
  if(diffDays >= 0) return 'inProgress';
  return 'pending';
}

function updateKPI(filtered){
  var counts = { overdue:0, pending:0, inProgress:0, completed:0 };
  filtered.forEach(function(row){
    var status = getRowStatus(row);
    counts[status]++;
  });
  document.getElementById('kpiOverdue').textContent = counts.overdue;
  document.getElementById('kpiPending').textContent = counts.pending;
  document.getElementById('kpiInProgress').textContent = counts.inProgress;
  document.getElementById('kpiCompleted').textContent = counts.completed;
}

function renderDetail(){
  var filtered = detailRows;
  if(selectedRegions !== null){
    filtered = detailRows.filter(function(r){ return selectedRegions.indexOf(r[2]) > -1; });
  }
  
  updateKPI(filtered);
  
  document.getElementById('detailTable').innerHTML=filtered.map(function(r){
    return '<tr>'+
      '<td style="color:#56afe0;font-weight:600">'+r[2]+'</td>'+
      '<td class="col-time">'+r[0]+'</td>'+
      '<td><span class="tag '+levelTag[r[1]]+'">'+r[1]+'</span></td>'+
      '<td style="color:#56afe0;font-weight:600">'+r[3]+'</td>'+
      '<td><span class="tag '+(r[4]==='是'?'tag-green':'tag-gray')+'">'+r[4]+'</span></td>'+
      '<td style="color:#7fa3c0">'+r[5]+'</td>'+
      '<td>'+r[6]+'</td>'+
      '<td style="color:#3ddc84">'+r[7]+'</td>'+
      '<td>'+r[8]+'</td>'+
      '<td>'+r[9]+'</td>'+
      '<td class="col-time">'+r[10]+'</td>'+
      '<td class="col-time">'+r[11]+'</td>'+
      '<td class="cell-wrap">'+(r[12]?r[12]:'<span style="color:#7fa3c0">—</span>')+'</td>'+
    '</tr>';
  }).join('');
}

renderDetail();
</script>
